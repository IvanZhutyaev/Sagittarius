apiVersion: apps/v1
kind: Deployment
metadata:
  name: bidder-service
  labels:
    app: bidder-service
spec:
  replicas: 5
  selector:
    matchLabels:
      app: bidder-service
  template:
    metadata:
      labels:
        app: bidder-service
    spec:
      containers:
      - name: bidder-service
        image: your-registry/sagittarius-bidder:latest
        ports:
        - containerPort: 8081
        env:
        - name: BUDGET_SERVICE_URL
          value: "budget-service:50051"
        - name: KAFKA_BROKERS
          value: "kafka:9092"
        - name: REDIS_URL
          value: "redis:6379"
        - name: HTTP_PORT
          value: "8081"
        - name: JAEGER_URL
          value: "http://jaeger:14268/api/traces"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bidder-service
spec:
  selector:
    app: bidder-service
  ports:
  - port: 8081
    targetPort: 8081
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bidder-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bidder-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

