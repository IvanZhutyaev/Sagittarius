version: '3.8'

services:
  # Databases
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sagittarius
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: sagittarius
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""

  # Message Broker
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411

  # Services
  budget-service:
    build:
      context: .
      dockerfile: services/budget/Dockerfile
    ports:
      - "50051:50051"
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/sagittarius?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      GRPC_PORT: 50051
      JAEGER_URL: http://jaeger:14268/api/traces
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 3

  bidder-service:
    build:
      context: .
      dockerfile: services/bidder/Dockerfile
    ports:
      - "8081:8081"
    environment:
      BUDGET_SERVICE_URL: budget-service:50051
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis:6379
      HTTP_PORT: 8081
      JAEGER_URL: http://jaeger:14268/api/traces
    depends_on:
      - budget-service
      - redis
      - kafka

  auction-engine:
    build:
      context: .
      dockerfile: services/auction-engine/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      JAEGER_URL: http://jaeger:14268/api/traces
    depends_on:
      - kafka

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    ports:
      - "8083:8083"
    environment:
      KAFKA_BROKERS: kafka:9092
      HTTP_PORT: 8083
      JAEGER_URL: http://jaeger:14268/api/traces
    depends_on:
      - kafka

  analytics-aggregator:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
    depends_on:
      - kafka
      - clickhouse

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      BIDDER_SERVICE_URL: http://bidder-service:8081
      AUCTION_SERVICE_URL: http://auction-engine:8082
      HTTP_PORT: 8080
      JWT_SECRET: your-secret-key-change-in-production
    depends_on:
      - bidder-service
      - auction-engine

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  zookeeper_data:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: sagittarius-network

